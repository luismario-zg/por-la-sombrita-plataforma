<article class="thread-card"><div class="fila"><span class="badge {{ t.state }}">{{ states[t.state] }}</span><small>{{ t.created[:10] }} · Inició {{ t.author_name }}</small></div><h3><a href="/discusiones/{{ t.id }}">{{ t.title }}</a></h3><p>{{ t.topic }}</p><small>{{ t.document_title|default(t.document) }} · {{ t.section_title }}{% if t.quote %} · Sobre un fragmento{% endif %}</small></article>
