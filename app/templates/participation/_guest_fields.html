<label>Seudónimo o nombre elegido<input name="display_name" required maxlength="120" autocomplete="nickname" placeholder="Así aparecerá tu aportación"></label>
<details class="guest-contact"><summary>Identificarme o dejar contacto (opcional)</summary>
  <p class="form-note">Estos datos serán privados y solo podrán consultarlos quienes moderan contenido. No se publican con tu aportación.</p>
  <label>Nombre<input name="contact_name" maxlength="160" autocomplete="name"></label>
  <label>Organización<input name="contact_organization" maxlength="200" autocomplete="organization"></label>
  <label>Teléfono<input name="contact_phone" maxlength="60" autocomplete="tel" inputmode="tel"></label>
  <label>Correo<input name="contact_email" type="email" maxlength="254" autocomplete="email"></label>
</details>
