# El worker procesa una ficha por vez y lanza `codex exec --ephemeral` dentro de
# este mismo cgroup (KillMode=control-group). El presupuesto cubre worker +
# proceso de Codex, no solo el worker.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
CPUQuota=50%
CPUWeight=30
IOWeight=30
MemoryHigh=1G
MemoryMax=1536M
MemorySwapMax=0
TasksMax=64
RestartSec=10
