# Límites de cgroup exigidos tras el incidente del 2026-09-17.
# Dimensionados sobre medición del 2026-09-18: 57 MiB en reposo y un pico de
# 122 MiB con 120 peticiones concurrentes. MemoryHigh queda ~4x sobre el pico
# medido: un umbral por debajo del working set estrangula sin matar y degrada
# en silencio (ver INCIDENT_2026-09-17 en codex_control_app, secuela del 18).
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
CPUQuota=50%
CPUWeight=40
IOWeight=40
MemoryHigh=512M
MemoryMax=768M
MemorySwapMax=0
TasksMax=64
RestartSec=10
